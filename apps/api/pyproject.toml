[project]
name = "opencaptions-api"
version = "0.1.0"
description = "OpenCaptions backend. FastAPI + Celery + faster-whisper"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Leo Gaudin" }]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "faster-whisper>=1.1",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "websockets>=14",
]

[project.optional-dependencies]
gpu = [
    # CUDA 12 runtime libraries for CTranslate2 4.x GPU inference.
    # These pip wheels provide cublas and cuDNN shared objects under
    # site-packages/nvidia/*/lib/. LD_LIBRARY_PATH must point there.
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]
dev = [
    "boto3-stubs[s3]>=1.35",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Test-only: in-memory DB + fake Redis so auth/session/isolation tests run
    # without Postgres or a live Redis (the production code path is unchanged,
    # tests swap the client, not the logic).
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# C90 (mccabe) is deliberately selected: without it the `# noqa: C901` markers
# in this codebase are inert and complexity can regress unnoticed.
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "C90", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "ffmpeg.*", "faster_whisper.*", "ctranslate2.*"]
ignore_missing_imports = true

# redis 8.x exposes `aclose()` at runtime on both Redis and PubSub, but the
# bundled type stubs lag behind and don't declare it. The method IS the correct
# async cleanup path (replacing the deprecated `close()` coroutine pattern).
# Scoped to the websocket module which is the sole async redis consumer.
[[tool.mypy.overrides]]
module = ["app.api.websocket"]
disable_error_code = ["no-untyped-call"]

# The session store and per-job token modules call redis-py's from_url + client
# methods, which the incomplete bundled stubs flag as untyped calls under strict
# mypy. The calls are correct at runtime; scope the relaxation to these consumers.
[[tool.mypy.overrides]]
module = ["app.core.redis", "app.core.sessions", "app.core.job_tokens", "app.core.reset_tokens"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --tb=short"
testpaths = ["tests"]
