# The iOS app's Xcode project, generated by XcodeGen (`make ios-project`); the
# .xcodeproj is not committed. All logic lives in OpenCaptionsKit; this target is
# SwiftUI views and wiring.
name: OpenCaptions
options:
  bundleIdPrefix: org.leogaudin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0 # kept equal to the other manifests by scripts/check-version-sync.sh
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: R32B9PWM4R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # The engine is built for the Apple-silicon simulator only (see build-apple.sh).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
packages:
  OpenCaptionsKit:
    path: OpenCaptionsKit
targets:
  OpenCaptions:
    type: application
    platform: iOS
    sources:
      - path: OpenCaptions
      # The engine's fonts, the same files the server and the browser draw with.
      - path: ../engine/fonts
        type: folder
        buildPhase: resources
      # The built-in style presets, shared with the web app.
      - path: ../web/src/lib/presets.json
        buildPhase: resources
    dependencies:
      - package: OpenCaptionsKit
      - package: OpenCaptionsKit
        product: OpenCaptionsTranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.leogaudin.opencaptions
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenCaptions
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Saves your captioned videos to Photos.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
