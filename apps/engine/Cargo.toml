[package]
name = "opencaptions-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }

# The render server only: the library the browser and the apps use does not carry its HTTP stack.
tiny_http = { version = "0.12", optional = true }
ureq = { version = "3", features = ["json"], optional = true }

[features]
server = ["dep:tiny_http", "dep:ureq"]

[[bin]]
name = "opencaptions-engine"
path = "src/main.rs"
required-features = ["server"]

[profile.release]
lto = true
codegen-units = 1
strip = true
