[package]
name = "opencaptions-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }

# The render server only; the WASM and iOS builds are the library alone.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
