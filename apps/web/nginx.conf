server {
    listen 5173;
    server_name _;

    # Must match MAX_UPLOAD_SIZE_MB in apps/api/app/core/config.py (2048 MB).
    client_max_body_size 2048m;

    # Docker's embedded DNS, needed so nginx re-resolves the upstream
    # `api` hostname on every request instead of caching the IP at startup.
    # Without this, restarting the api container leaves nginx with a stale
    # IP and every /api/* call returns 502.
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API to the api service inside the compose network.
    # Using a variable forces nginx to honor the resolver above.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # WebSocket
    location /ws/ {
        set $ws_upstream http://api:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
