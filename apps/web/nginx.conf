server {
    listen 5173;
    server_name _;
    server_tokens off;

    # Must match MAX_UPLOAD_SIZE_MB in apps/api/app/core/config.py (2048 MB).
    client_max_body_size 2048m;

    # Docker's embedded DNS, needed so nginx re-resolves the upstream
    # `api` hostname on every request instead of caching the IP at startup.
    # Without this, restarting the api container leaves nginx with a stale
    # IP and every /api/* call returns 502.
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Compression. The stock configuration has gzip off, so the script, the stylesheet, the
    # engine's WebAssembly and its fonts (several MB together) went out as they were.
    # Video and images are already compressed and are left alone.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Headers every response carries. nginx drops inherited add_header lines in a
    # location that sets its own, so the locations below that do repeat these three.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself is not fingerprinted: it must be fetched again to find the new
    # fingerprinted files after an upgrade.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Built files carry a hash in their name: cache them for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # The caption engine (WebAssembly) and its fonts keep their names between
    # versions, so they are revalidated (a 304 when unchanged), not cached for good. A
    # missing file is a 404 here, not index.html answering 200, which the browser would
    # try to compile as WebAssembly.
    location /engine/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Reverse-proxy API to the api service inside the compose network.
    # Using a variable forces nginx to honor the resolver above.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        # The source video and a finished download are streamed from storage: pass
        # them on as they arrive rather than spooling a whole file to disk first.
        proxy_buffering off;
    }

    # WebSocket
    location /ws/ {
        set $ws_upstream http://api:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
