<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title, description, icons, cards and structured data: src/demo/seo.ts, written in at build. -->
    <!--seo-head-->
    <link rel="preload" href="/engine/fonts/Montserrat-Black.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 900; font-display: swap; src: url("/engine/fonts/Montserrat-Black.ttf") format("truetype"); }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("opencaptions:theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) { /* localStorage may be blocked */ }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
