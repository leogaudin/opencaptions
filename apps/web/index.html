<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenCaptions — open-source AI captioning, self-hosted, Docker-first." />
    <title>OpenCaptions</title>
    <script>
      // Apply persisted theme synchronously to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem("opencaptions:theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) { /* localStorage may be blocked */ }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
