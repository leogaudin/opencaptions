version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  # `uv`, not `pip`: the project is locked with uv.lock, which only this ecosystem updates
  # (a bump of pyproject.toml alone would fail `uv sync --locked`).
  - package-ecosystem: uv
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/engine
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/engine
    schedule: { interval: weekly }
  # The images the stack pulls (postgres, redis, garage) are named in the compose file.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
