name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

# Least privilege by default; the publish jobs ask for what they push with.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. Pushes to main and tags are
# never cancelled: each one publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks are the Makefile's CI_CHECKS, the list `make ci` runs: one job each, in parallel, each
  # `make <check>` in its pinned container. A new check is added there and nowhere here.
  plan:
    name: List the checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "checks=$(make -s ci-list)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    env:
      CI_CACHE: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # What the checks keep between runs (uv, npm, cargo, the Playwright browser), restored by the
      # lock files it depends on.
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: ci-cache-${{ matrix.check }}-${{ hashFiles('apps/api/uv.lock', 'apps/web/package-lock.json', 'apps/engine/Cargo.lock') }}
          restore-keys: ci-cache-${{ matrix.check }}-
      - name: Run the check
        run: make ${{ matrix.check }}
      # What a failed e2e run leaves to look at: the stack's logs, and Playwright's report and traces.
      - name: Keep the failure evidence
        if: ${{ failure() && matrix.check == 'e2e' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            compose.log
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      # The static sites the publish jobs deploy are the ones the checks build.
      - name: Keep the demo site
        if: ${{ matrix.check == 'build-demo' }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: apps/web/dist-demo
          if-no-files-found: error
      - name: Keep the documentation site
        if: ${{ matrix.check == 'build-docs' }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error

  # The multi-arch images a release will publish must build: the checks build amd64 only.
  build-multi-arch:
    name: Build images (linux/amd64, linux/arm64)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check]
    strategy:
      matrix:
        service: [api, engine, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          build-contexts: engine=apps/engine
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [check]
    if: ${{ github.event_name == 'push' }}
    env:
      # `secrets` may not appear in a step-level `if`, so decide once here.
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, engine, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Always push to GHCR (uses GITHUB_TOKEN); push to Docker Hub only
          # when credentials are configured, prevents tag-push failures when
          # DOCKERHUB_TOKEN is not set on the repository.
          images: |
            ghcr.io/${{ github.repository_owner }}/opencaptions-${{ matrix.service }}
            docker.io/opencaptions/${{ matrix.service }},enable=${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short
      - name: Determine platforms
        id: platforms
        run: echo "platforms=${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.service }}
          build-contexts: engine=apps/engine
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # The README's promise: copy docker-compose.yml alone into an empty directory, `docker compose up -d`,
  # and it runs, from images anyone can pull. This is that, against the images just published, so a
  # missing tag or a broken image is found here and not by the first person who tries it. A release
  # tag is tried as a user gets it (no version set, so `latest`); a branch by its own commit.
  smoke-published:
    name: Smoke the published images (the compose file alone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [publish]
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - name: Copy only the compose file
        run: mkdir "$RUNNER_TEMP/oc" && cp docker-compose.yml "$RUNNER_TEMP/oc/"
      - name: Start it as a user would
        run: |
          cd "$RUNNER_TEMP/oc"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then export OPENCAPTIONS_VERSION="sha-${GITHUB_SHA::7}"; fi
          docker compose up -d --wait --wait-timeout 600
      - name: The app answers
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://localhost:5173/api/v1/health
          curl -fsS -o /dev/null http://localhost:5173/
      - name: Logs
        if: ${{ failure() }}
        run: cd "$RUNNER_TEMP/oc" && docker compose logs --no-color --tail 200
      - name: Stop
        if: ${{ always() }}
        run: cd "$RUNNER_TEMP/oc" && docker compose down -v

  publish-demo:
    name: Publish the demo site (Cloudflare Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      # `secrets` may not appear in a step-level `if`, so decide once here.
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ env.CLOUDFLARE_CONFIGURED == 'true' }}
        with:
          name: demo-site
          path: dist-demo
      - name: Deploy
        if: ${{ env.CLOUDFLARE_CONFIGURED == 'true' }}
        run: npx --yes wrangler@4 deploy --assets dist-demo --name opencaptions --compatibility-date 2026-10-01

  publish-docs:
    name: Publish the documentation site (Cloudflare Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      # `secrets` may not appear in a step-level `if`, so decide once here.
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.CLOUDFLARE_CONFIGURED == 'true' }}
      - uses: actions/download-artifact@v4
        if: ${{ env.CLOUDFLARE_CONFIGURED == 'true' }}
        with:
          name: docs-site
          path: apps/docs/dist
      - name: Deploy
        if: ${{ env.CLOUDFLARE_CONFIGURED == 'true' }}
        working-directory: apps/docs
        run: npx --yes wrangler@4 deploy

  publish-gpu:
    name: Publish GPU image (api only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [check]
    if: ${{ github.event_name == 'push' }}
    env:
      # `secrets` may not appear in a step-level `if`, so decide once here.
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/opencaptions-api
            docker.io/opencaptions/api,enable=${{ secrets.DOCKERHUB_TOKEN != '' }}
          # GPU images get a -gpu suffix on every tag
          flavor: suffix=-gpu
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short
      - name: Build & push (GPU, amd64 only. CUDA has no ARM images)
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          target: runtime-gpu
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read the cache but never export it: several GB of CUDA layers,
          # uploaded after the image is already pushed, can fail a good publish.
          cache-from: |
            type=gha,scope=api
            type=gha,scope=api-gpu
